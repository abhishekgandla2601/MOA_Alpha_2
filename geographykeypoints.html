```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Geography Study Materials</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-image: url("https://i.pinimg.com/1200x/80/3c/c2/803cc24726e912cfdcf79e9b80a60ff0.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
        }

        /* Center the images */
        .card {
            height: 100%;
            background-color: rgba(255, 255, 255, 0.9);
        }

        .card-img-top {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .image-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>

    <div class="container py-4">

        <h1 class="text-center mb-4">
            Geography Key Points
        </h1>

        <!-- First Row: Three Images -->
        <div class="row g-4 justify-content-center">

            <div class="col-md-4 col-sm-6">
                <div class="card">
                    <img src="Images/Desert.jpeg"
                         class="card-img-top"
                         alt="Desert">
                </div>
            </div>

            <div class="col-md-4 col-sm-6">
                <div class="card">
                    <img src="Images/Major rivers of india.jpeg"
                         class="card-img-top"
                         alt="Major Rivers of India">
                </div>
            </div>

            <div class="col-md-4 col-sm-6">
                <div class="card">
                    <img src="Images/Rock Cycle.jpeg"
                         class="card-img-top"
                         alt="Rock Cycle">
                </div>
            </div>

        </div>

        <!-- Second Row: Image Centered -->
        <div class="row g-4 justify-content-center mt-1">

            <div class="col-md-4 col-sm-6">
                <div class="card">
                    <img src="Images/Types of mountains.jpeg"
                         class="card-img-top"
                         alt="Types of Mountains">
                </div>
            </div>

        </div>

    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
