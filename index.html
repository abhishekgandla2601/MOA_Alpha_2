
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alpha-2</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        .card-img-top {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }


    </style>

    
<style>
    body {
        background-image: url("https://i.pinimg.com/736x/d7/43/ff/d743ffb6e29c259317d813dee6c1ad2a.jpg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        min-height: 100vh;
    }
</style>

</head>

<body>

    <div class="container py-4">

        <marquee scrollamount="15"><h1 class="text-center mb-4">

        </h1>
        </marquee>

        <div class="row g-4">

            <!-- Geography Card -->
            <div class="col-md-4">
                <div class="card h-100">
                    <img
                        src="https://i.pinimg.com/736x/93/2b/55/932b55c69219f7414415ccb538a4b5c7.jpg"
                        class="card-img-top"
                        alt="Geography">

                    <div class="card-body text-center">
                        <h4 class="card-title text-inverse">
                            Geography
                        </h4>

                        <a href="geography.html"
                           class="btn btn-success">
                            Open
                        </a>
                    </div>
                </div>
            </div>

            <!-- History Card -->
            <div class="col-md-4">
                <div class="card h-100">
                    <img
                        src="https://placehold.co/600x400?text=History"
                        class="card-img-top"
                        alt="History">

                    <div class="card-body text-center">
                        <h4 class="card-title text-inverse">
                            History

            </div>

            <!-- Polity Card -->
            <div class="col-md-4">
                <div class="card h-100">
                    <img
                        src="https://placehold.co/600x400?text=Polity"
                        class="card-img-top"
                        alt="Polity">

                    <div class="card-body text-center">
                        <h4 class="card-title text-inverse">
                            Polity
                        </h4>

                        <a href="polity.html"
                           class="btn btn-success">
                            Open
                        </a>
                    </div>
                </div>

</html>
