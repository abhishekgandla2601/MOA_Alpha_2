<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PDF Viewer | Alpha-2</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
          rel="stylesheet">

    <style>
        :root {
            --bg: #f5f7fa;
            --surface: #ffffff;
            --text: #172d42;
            --muted: #718092;
            --accent: #e87524;
            --border: rgba(23, 45, 66, .12);
        }

        body.dark-mode {
            --bg: #101d29;
            --surface: #1b2b39;
            --text: #f5f7fa;
            --muted: #b2bfca;
            --accent: #ffad64;
            --border: rgba(255, 255, 255, .13);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 12px 18px;
        }

        .topbar {
            max-width: 1200px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .brand {
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--accent);
            text-decoration: none;
            white-space: nowrap;
        }

        .theme-btn,
        .tool-btn {
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            border-radius: 9px;
            padding: 8px 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .page-title {
            max-width: 1200px;
            margin: 18px auto 12px;
            padding: 0 16px;
            font-family: 'Playfair Display', serif;
            font-size: clamp(20px, 4vw, 28px);
            overflow-wrap: anywhere;
        }

        .toolbar {
            max-width: 1200px;
            margin: 0 auto 14px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tool-btn:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        .page-info {
            color: var(--muted);
            font-size: 14px;
            font-weight: 600;
        }

        #reader {
            width: 100%;
            padding: 0 12px 30px;
            overflow: auto;
        }

        #pdfCanvas {
            display: block;
            margin: 0 auto;
            background: white;
            box-shadow: 0 4px 24px rgba(0, 0, 0, .13);
            max-width: 100%;
            height: auto;
        }

        #loading {
            min-height: 55vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 14px;
            color: var(--muted);
            text-align: center;
            padding: 20px;
        }

        .spinner-border {
            color: var(--accent);
        }

        #error {
            display: none;
            max-width: 650px;
            margin: 50px auto;
            padding: 25px;
            text-align: center;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
        }

        #error h3 {
            color: var(--accent);
        }

        .back-link {
            color: var(--accent);
            text-decoration: none;
            font-weight: 700;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            header {
                padding: 10px 12px;
            }

            .page-title {
                margin-top: 14px;
            }

            .toolbar {
                justify-content: center;
            }

            .toolbar-group {
                justify-content: center;
            }

            .tool-btn {
                padding: 8px 10px;
                font-size: 13px;
            }

            #reader {
                padding: 0 5px 20px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: .01ms !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="topbar">
        <a href="index.html" class="brand">ALPHA-2</a>
        <button class="theme-btn" id="themeToggle">🌙 Theme</button>
    </div>
</header>

<h1 class="page-title" id="documentTitle">Study Material</h1>

<div class="toolbar">

    <div class="toolbar-group">
        <a href="geography.html" class="back-link" id="backLink">
            ← Back to Subjects
        </a>
    </div>

    <div class="toolbar-group">
        <button class="tool-btn" id="prevBtn" disabled>← Previous</button>
        <span class="page-info" id="pageInfo">Page 0 of 0</span>
        <button class="tool-btn" id="nextBtn" disabled>Next →</button>
    </div>

    <div class="toolbar-group">
        <button class="tool-btn" id="zoomOut">−</button>
        <span class="page-info" id="zoomLevel">100%</span>
        <button class="tool-btn" id="zoomIn">+</button>
        <button class="tool-btn" id="fullscreenBtn">⛶ Fullscreen</button>
    </div>

</div>

<div id="loading">
    <div class="spinner-border" role="status"></div>
    <strong>Loading your study material...</strong>
    <span>Please wait.</span>
</div>

<div id="error">
    <h3>Unable to open PDF</h3>
    <p id="errorMessage">
        The requested PDF could not be loaded.
    </p>
    <p>Please check that the PDF file exists in the same folder as this page.</p>
    <a href="geography.html" class="back-link" id="errorBackLink">
        Return to study materials
    </a>
</div>

<div id="reader" style="display:none;">
    <canvas id="pdfCanvas"></canvas>
</div>

<script type="module">
    import * as pdfjsLib from
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';

    pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';

    const params = new URLSearchParams(window.location.search);

    const file = params.get('file');
    const title = params.get('title');

    const allowedFiles = [
        'Continental Drifting.pdf',
        'India Geography.pdf',
        'Geological Time Scale or period.pdf',
        'The Himalayas.pdf',
        'Drainage System of India.pdf',
        'Peninsular Rivers.pdf',
        'Climate of india.pdf',
        'Classification of rocks and rock cycle.pdf',
        'Soils of india.pdf',
        'Indian Minerals.pdf',
        'India-Agriculture.pdf',
        'Natural Vegetation.pdf',
        'India Major Crops.pdf',
        'India- Industries -Geographical Perspective.pdf',
        'India Transport Geography.pdf',
        'India Population -Cultural Geography.pdf',
        'The Origin of the Earth.pdf',
        'Economy Syllabus@Civils@Sarvan sir.pdf',
        'National Income Accounting.pdf'
    ];

    const loading = document.getElementById('loading');
    const error = document.getElementById('error');
    const reader = document.getElementById('reader');
    const canvas = document.getElementById('pdfCanvas');
    const context = canvas.getContext('2d');

    const pageInfo = document.getElementById('pageInfo');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const zoomLevel = document.getElementById('zoomLevel');

    let pdfDoc = null;
    let currentPage = 1;
    let zoom = 1;
    let rendering = false;
    let renderTask = null;

    const isEconomy = file && (
        file === 'Economy Syllabus@Civils@Sarvan sir.pdf' ||
        file === 'National Income Accounting.pdf'
    );

    const backPage = isEconomy ? 'economy.html' : 'geography.html';

    document.getElementById('backLink').href = backPage;
    document.getElementById('errorBackLink').href = backPage;

    document.getElementById('documentTitle').textContent =
        title || 'Study Material';

    document.title = (title || 'PDF Viewer') + ' | Alpha-2';

    function showError(message) {
        loading.style.display = 'none';
        reader.style.display = 'none';
        error.style.display = 'block';
        document.getElementById('errorMessage').textContent = message;
    }

    async function renderPage(pageNumber) {
        if (!pdfDoc || rendering) return;

        rendering = true;

        try {
            if (renderTask) {
                renderTask.cancel();
            }

            const page = await pdfDoc.getPage(pageNumber);

            const baseViewport = page.getViewport({ scale: 1 });

            const availableWidth = Math.max(
                280,
                reader.clientWidth - 24
            );

            const fitScale = availableWidth / baseViewport.width;

            const scale = Math.min(fitScale * zoom, 3);

            const viewport = page.getViewport({ scale });

            const pixelRatio = Math.min(
                window.devicePixelRatio || 1,
                2
            );

            canvas.width = Math.floor(viewport.width * pixelRatio);
            canvas.height = Math.floor(viewport.height * pixelRatio);

            canvas.style.width = viewport.width + 'px';
            canvas.style.height = viewport.height + 'px';

            context.setTransform(
                pixelRatio, 0, 0,
                pixelRatio, 0, 0
            );

            renderTask = page.render({
                canvasContext: context,
                viewport: viewport
            });

            await renderTask.promise;

            currentPage = pageNumber;

            pageInfo.textContent =
                `Page ${currentPage} of ${pdfDoc.numPages}`;

            prevBtn.disabled = currentPage <= 1;
            nextBtn.disabled = currentPage >= pdfDoc.numPages;

            zoomLevel.textContent = Math.round(zoom * 100) + '%';

            reader.scrollTo({
                top: 0,
                behavior: 'auto'
            });

        } catch (err) {
            if (err.name !== 'RenderingCancelledException') {
                console.error(err);
            }
        } finally {
            rendering = false;
            renderTask = null;
        }
    }

    async function loadPDF() {
        if (!file || !allowedFiles.includes(file)) {
            showError('Invalid PDF file requested. Please open the PDF from the subject page.');
            return;
        }

        try {
            const pdfDocLoading = pdfjsLib.getDocument({
                url: encodeURIComponent(file)
            });

            pdfDoc = await pdfDocLoading.promise;

            loading.style.display = 'none';
            reader.style.display = 'block';

            await renderPage(1);

        } catch (err) {
            console.error('PDF loading error:', err);

            showError(
                'The PDF could not be loaded. Check the filename, file location, and internet connection.'
            );
        }
    }

    prevBtn.addEventListener('click', () => {
        if (currentPage > 1) {
            renderPage(currentPage - 1);
        }
    });

    nextBtn.addEventListener('click', () => {
        if (pdfDoc && currentPage < pdfDoc.numPages) {
            renderPage(currentPage + 1);
        }
    });

    document.getElementById('zoomIn').addEventListener('click', () => {
        zoom = Math.min(zoom + 0.15, 2.5);
        renderPage(currentPage);
    });

    document.getElementById('zoomOut').addEventListener('click', () => {
        zoom = Math.max(zoom - 0.15, 0.5);
        renderPage(currentPage);
    });

    document.getElementById('fullscreenBtn').addEventListener('click', async () => {
        try {
            if (!document.fullscreenElement) {
                await reader.requestFullscreen();
            } else {
                await document.exitFullscreen();
            }
        } catch (err) {
            console.error('Fullscreen unavailable:', err);
        }
    });

    document.getElementById('themeToggle').addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');

        const isDark = document.body.classList.contains('dark-mode');

        localStorage.setItem('alpha2-theme', isDark ? 'dark' : 'light');

        document.getElementById('themeToggle').textContent =
            isDark ? '☀️ Theme' : '🌙 Theme';
    });

    const savedTheme = localStorage.getItem('alpha2-theme');

    if (savedTheme === 'dark') {
        document.body.classList.add('dark-mode');
        document.getElementById('themeToggle').textContent = '☀️ Theme';
    }

    let resizeTimer;

    window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);

        resizeTimer = setTimeout(() => {
            if (pdfDoc) {
                renderPage(currentPage);
            }
        }, 200);
    });

    loadPDF();
</script>

</body>
</html>
